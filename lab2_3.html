<!DOCTYPE html>
<html>

<head>
    <title>Список задач</title>
    <link rel="stylesheet" type="text/css" href="lab2_3.css" />
</head>

<body>
    <h1>Список задач</h1>
    <input type="text" id="new-task" placeholder="Введите задачу" />
    <button id="add-button" class="add">Добавить</button>
    <ul id="todo-list"></ul>
    <script>
        const tasks = [];

        function addTask() {
            const newTask = document.getElementById('new-task').value;
            if (newTask.trim() !== '') {
                tasks.push({ task: newTask, completed: false });
                const taskIndex = tasks.length - 1;

                const listItem = document.createElement('li');
                listItem.className = 'todo-item';
                const taskNameElement = document.createElement('span');
                taskNameElement.innerText = newTask;
                listItem.appendChild(taskNameElement);

                const editButton = document.createElement('button');
                editButton.innerText = newTask;
                editButton.className = 'edit-btn';
                editButton.addEventListener('click', function (event) {
                    event.stopPropagation();
                    const newName = prompt('Введите новое название задачи', tasks[taskIndex.task]);
                    if (newName !== null && newName.trim !== '') {
                        tasks[taskIndex].task = newName.trim();
                        taskNameElement.innerText = newName.trim()
                    }
                });
                listItem.appendChild(editButton);

                const deleteButton = document.createElement('button');
                deleteButton.innerText = 'cancel'
                deleteButton.className = 'delete-btn';
                deleteButton.addEventListener('click', function (event) {
                    event.stopPropagation();
                    tasks.splice(taskIndex, 1);
                    listItem.remove();
                });
                listItem.appendChild(deleteButton);

                listItem.addEventListener('click', function () {
                    tasks[taskIndex].completed = !tasks[taskIndex].completed;
                    listItem.classList.toggle('completed');
                });

                document.getElementById('todo-list').appendChild(listItem);
                document.getElementById('new-task').value = '';
            }
        }

        document.getElementById('add-button').onclick = addTask;
    </script>
</body>

</html>
